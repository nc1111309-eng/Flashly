<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
h2{
    background: linear-gradient(rgb(236, 5, 90), rgb(32, 5, 1));
background-clip: text;
color: transparent;
}
</style>
<body  >
    <br><br><br><br>
    <center>
        <h2 >Login</h2>
        <form  style="border: 2px solid black;border-radius: 15%; height: 350px;width: 400px;background:linear-gradient(red,yellow);">
            <br><br><br>
            <input type="text" placeholder=" Name" style="height: 30px;width: 250px; border-radius: 10px;" required>
            <br><br>
            <input type="email" placeholder=" Email Address or Mobile Number" style="height: 30px;width: 250px; border-radius: 10px;"required>
            <br><br>
            <input type="password" placeholder="Password" style="height: 30px;width: 250px; border-radius: 10px;" required>
            <br><br><br>
            <button style="border-radius: 20px;background-color: #2BEE34; color: white; height: 32px; width: 250px;"> Submit
            </button>
            <p style="color: rgb(7, 8, 8);">Forget your password?</p>
            
        </form>
    </center>
</body>
</html>
